services:
  dns:
    build: ./dns
    container_name: dns
    ports:
      - "20053:53/udp"
      - "20053:53/tcp"
    networks:
      sae_net:
        ipv4_address: 172.16.0.2

  ntp:
    build: ./ntp
    container_name: ntp
    cap_add:
      - SYS_TIME
    ports:
      - "123:123/udp"
    networks:
      sae_net:
        ipv4_address: 172.16.0.3

  vpn:
    build: ./vpn
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    ports:
      - "11194:1194/udp"
    networks:
      sae_net:
        ipv4_address: 172.16.0.5

networks:
  sae_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
